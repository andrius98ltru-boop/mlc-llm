name: Build OMNILOQUI Qwen3 Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout MLC LLM
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang \
            llvm \
            libvulkan-dev \
            vulkan-tools \
            openjdk-17-jdk \
            git-lfs \
            curl \
            unzip \
            zstd

          git lfs install
          rustc --version
          cargo --version
          java -version
          cmake --version

      - name: Install prebuilt MLC compiler
        run: |
          python -m pip install --upgrade pip

          python -m pip install --pre -U \
            -f https://mlc.ai/wheels \
            mlc-llm-nightly-cpu \
            mlc-ai-nightly-cpu

          python -m pip install -U \
            psutil \
            numpy \
            scipy \
            decorator \
            attrs \
            tornado \
            typing_extensions \
            ml_dtypes \
            packaging \
            cloudpickle

          python -c "import tvm; print('TVM OK:', tvm.__file__)"
          python -c "import mlc_llm; print('MLC LLM OK:', mlc_llm.__file__)"
          python -m mlc_llm package --help

      - name: Configure Android NDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"

          NDK_DIR="$(find "$ANDROID_HOME/ndk" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -1)"

          if [ -z "$NDK_DIR" ]; then
            echo "Android NDK not found"
            exit 1
          fi

          echo "Using Android NDK: $NDK_DIR"

          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "TVM_SOURCE_DIR=$GITHUB_WORKSPACE/3rdparty/tvm" >> "$GITHUB_ENV"

          CC="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang"

          if [ ! -x "$CC" ]; then
            echo "NDK clang not found: $CC"
            exit 1
          fi

          echo "TVM_NDK_CC=$CC" >> "$GITHUB_ENV"

      - name: Create OMNILOQUI package config
        run: |
          cat > android/MLCChat/mlc-package-config.json <<'JSON'
          {
            "device": "android",
            "model_list": [
              {
                "model": "HF://mlc-ai/Qwen3-0.6B-q4f16_1-MLC",
                "model_id": "Qwen3-0.6B-q4f16_1-MLC",
                "estimated_vram_bytes": 1500000000,
                "overrides": {
                  "context_window_size": 1024,
                  "prefill_chunk_size": 64
                }
              }
            ]
          }
          JSON

          cat android/MLCChat/mlc-package-config.json

      - name: Build Qwen3 Android runtime
        working-directory: android/MLCChat
        env:
          MLC_JIT_POLICY: REDO
        run: |
          export MLC_LLM_SOURCE_DIR="$GITHUB_WORKSPACE"

          python -m mlc_llm package \
            --package-config mlc-package-config.json \
            --mlc-llm-source-dir "$GITHUB_WORKSPACE" \
            --output dist

      - name: Verify Android runtime
        working-directory: android/MLCChat
        run: |
          echo "===== DIST TREE ====="
          find dist -maxdepth 5 -type f | sort | head -200

          test -f \
            dist/lib/mlc4j/output/arm64-v8a/libtvm4j_runtime_packed.so

          test -f \
            dist/lib/mlc4j/output/tvm4j_core.jar

          echo "===== RUNTIME ====="
          ls -lh \
            dist/lib/mlc4j/output/arm64-v8a/libtvm4j_runtime_packed.so

          echo "===== JAVA BINDING ====="
          ls -lh \
            dist/lib/mlc4j/output/tvm4j_core.jar

          echo "===== APP CONFIG ====="
          cat \
            dist/lib/mlc4j/src/main/assets/mlc-app-config.json

          echo "===== MODEL SYMBOLS ====="
          strings \
            dist/lib/mlc4j/output/arm64-v8a/libtvm4j_runtime_packed.so \
            | grep -iE 'qwen3|q4f16' \
            | head -80 || true

      - name: Pack artifact
        working-directory: android/MLCChat
        run: |
          tar -czf \
            omniloqui-qwen3-android-mlc4j.tar.gz \
            dist/lib/mlc4j

      - name: Upload OMNILOQUI Qwen3 runtime
        uses: actions/upload-artifact@v4
        with:
          name: omniloqui-qwen3-android-mlc4j
          path: android/MLCChat/omniloqui-qwen3-android-mlc4j.tar.gz
          if-no-files-found: error
          retention-days: 30
