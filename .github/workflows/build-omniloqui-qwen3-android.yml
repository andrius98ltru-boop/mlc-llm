name: Build OMNILOQUI Qwen3 Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout MLC LLM
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Pin compatible MLC revision
        run: |
          git checkout 2f78caa4
          git submodule sync --recursive
          git submodule update --init --recursive

          echo "===== MLC ====="
          git rev-parse HEAD

          echo "===== TVM ====="
          git -C 3rdparty/tvm rev-parse HEAD

          grep -n "func.buffer_map.values"             python/mlc_llm/compiler_pass/low_batch_specialization.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            cmake \
            ninja-build \
            clang \
            llvm \
            llvm-dev \
            libpolly-18-dev \
            lld \
            libz-dev \
            zlib1g-dev \
            libxml2-dev \
            libvulkan-dev \
            openjdk-17-jdk \
            git-lfs \
            curl \
            unzip \
            zstd

          python -m pip install --upgrade pip

          python -m pip install \
            numpy \
            cython \
            psutil \
            scipy \
            decorator \
            attrs \
            tornado \
            typing_extensions \
            ml_dtypes \
            packaging \
            cloudpickle

          git lfs install

          llvm-config --version
          cmake --version
          python --version

      - name: Verify source revisions
        run: |
          echo "===== MLC ====="
          git rev-parse HEAD

          echo "===== TVM ====="
          git -C 3rdparty/tvm rev-parse HEAD


      - name: Build matching TVM compiler
        run: |
          cd 3rdparty/tvm

          rm -rf build
          mkdir build
          cd build

          cp ../cmake/config.cmake .

          cat >> config.cmake <<'CONFIG'
          set(CMAKE_BUILD_TYPE Release)
          set(USE_LLVM "llvm-config --ignore-libllvm --link-static")
          set(HIDE_PRIVATE_SYMBOLS ON)
          set(USE_CUDA OFF)
          set(USE_ROCM OFF)
          set(USE_METAL OFF)
          set(USE_VULKAN OFF)
          set(USE_OPENCL OFF)
          set(USE_CUBLAS OFF)
          set(USE_CUDNN OFF)
          set(USE_CUTLASS OFF)
          CONFIG

          cmake .. -G Ninja
          cmake --build . --parallel 2

          test -f libtvm.so
          test -f libtvm_runtime.so

          ls -lh libtvm.so libtvm_runtime.so

      - name: Configure matching TVM Python
        run: |
          python -m pip install \
            ./3rdparty/tvm/3rdparty/tvm-ffi

          echo "TVM_LIBRARY_PATH=$GITHUB_WORKSPACE/3rdparty/tvm/build" \
            >> "$GITHUB_ENV"

          echo "PYTHONPATH=$GITHUB_WORKSPACE/3rdparty/tvm/python:$GITHUB_WORKSPACE/python" \
            >> "$GITHUB_ENV"

      - name: Build MLC LLM host library
        run: |
          rm -rf build-host
          mkdir build-host
          cd build-host

          python ../cmake/gen_cmake_config.py <<'ANSWERS' || true



          ANSWERS

          cmake .. \
            -DTVM_SOURCE_DIR="$GITHUB_WORKSPACE/3rdparty/tvm" \
            -DCMAKE_BUILD_TYPE=Release

          cmake --build . --parallel 2

          find . -maxdepth 3 \
            -type f \
            -name 'libmlc_llm.so' \
            -print

      - name: Configure MLC Python
        run: |
          MLC_LIB="$(find "$GITHUB_WORKSPACE/build-host" \
            -type f \
            -name libmlc_llm.so \
            | head -1)"

          if [ -z "$MLC_LIB" ]; then
            echo "libmlc_llm.so not found"
            exit 1
          fi

          MLC_LIB_DIR="$(dirname "$MLC_LIB")"

          echo "MLC_LIBRARY_PATH=$MLC_LIB_DIR" \
            >> "$GITHUB_ENV"

          echo "LD_LIBRARY_PATH=$MLC_LIB_DIR:$GITHUB_WORKSPACE/3rdparty/tvm/build" \
            >> "$GITHUB_ENV"

      - name: Validate MLC compiler
        run: |
          python - <<'PY'
          import tvm
          import mlc_llm

          print("TVM:", tvm.__file__)
          print("MLC:", mlc_llm.__file__)
          PY

          python -m mlc_llm compile --help | head -40

      - name: Configure Android NDK
        run: |
          NDK_DIR="$(find "$ANDROID_HOME/ndk" \
            -mindepth 1 \
            -maxdepth 1 \
            -type d \
            | sort -V \
            | tail -1)"

          if [ -z "$NDK_DIR" ]; then
            echo "Android NDK not found"
            exit 1
          fi

          echo "Using NDK: $NDK_DIR"

          echo "ANDROID_NDK=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"

          echo "TVM_SOURCE_DIR=$GITHUB_WORKSPACE/3rdparty/tvm" \
            >> "$GITHUB_ENV"

          echo "TVM_NDK_CC=$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang" \
            >> "$GITHUB_ENV"

      - name: Create OMNILOQUI package config
        run: |
          cat > android/MLCChat/mlc-package-config.json <<'JSON'
          {
            "device": "android",
            "model_list": [
              {
                "model": "HF://mlc-ai/Qwen3-0.6B-q4f16_1-MLC",
                "model_id": "Qwen3-0.6B-q4f16_1-MLC",
                "estimated_vram_bytes": 1500000000,
                "overrides": {
                  "context_window_size": 1024,
                  "prefill_chunk_size": 64
                }
              }
            ]
          }
          JSON

          cat android/MLCChat/mlc-package-config.json

      - name: Build Qwen3 Android runtime
        working-directory: android/MLCChat
        env:
          MLC_JIT_POLICY: REDO
        run: |
          export MLC_LLM_SOURCE_DIR="$GITHUB_WORKSPACE"

          python -m mlc_llm package \
            --package-config mlc-package-config.json \
            --mlc-llm-source-dir "$GITHUB_WORKSPACE" \
            --output dist

      - name: Verify Android runtime
        working-directory: android/MLCChat
        run: |
          test -f \
            dist/lib/mlc4j/output/arm64-v8a/libtvm4j_runtime_packed.so

          test -f \
            dist/lib/mlc4j/output/tvm4j_core.jar

          echo "===== runtime ====="

          ls -lh \
            dist/lib/mlc4j/output/arm64-v8a/libtvm4j_runtime_packed.so

          echo "===== app config ====="

          cat \
            dist/lib/mlc4j/src/main/assets/mlc-app-config.json

          echo "===== qwen symbols ====="

          strings \
            dist/lib/mlc4j/output/arm64-v8a/libtvm4j_runtime_packed.so \
            | grep -iE 'qwen3|q4f16' \
            | head -100 || true

      - name: Pack artifact
        working-directory: android/MLCChat
        run: |
          tar -czf \
            omniloqui-qwen3-android-mlc4j.tar.gz \
            dist/lib/mlc4j

      - name: Upload OMNILOQUI runtime
        uses: actions/upload-artifact@v4
        with:
          name: omniloqui-qwen3-android-mlc4j
          path: android/MLCChat/omniloqui-qwen3-android-mlc4j.tar.gz
          if-no-files-found: error
          retention-days: 30
